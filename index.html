    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #F4F4F4;
        color: #111111;
        overflow: hidden; /* Prevent body scroll, let desktop container handle it */
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        cursor: default;
      }

      /* Custom selection color */
      ::selection {
        background: #111111;
        color: #F4F4F4;
      }
      
      /* Minimalist Scrollbar for inside windows */
      ::-webkit-scrollbar {
        width: 4px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #111111;
      }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'off-white': '#F4F4F4',
              'pure-black': '#111111',
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            boxShadow: {
              'hard': '4px 4px 0px 0px rgba(17, 17, 17, 1)',
            }
          }
        }
      }
    </script>
